name: Bug Report
description: Report a problem with the integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please enable debug logging and reproduce the issue before filing."
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "e.g. 1.2.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.5.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: "Enable debug logging (see README), reproduce the issue, paste logs here"
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have enabled debug logging and included logs above
          required: true
        - label: I am on the latest version of the integration
          required: true
        - label: I have searched existing issues and this is not a duplicate
          required: true
